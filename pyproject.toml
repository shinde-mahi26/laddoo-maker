[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laddoomaker-cad"
version = "0.1.0"
description = "Parametric CAD source for LaddooMaker Mini Rev-A"
requires-python = ">=3.12,<3.14"
dependencies = ["cadquery==2.8.0", "pyyaml>=6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/laddoomaker"]

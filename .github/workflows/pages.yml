name: Publish engineering explorer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check rev_b/explorer/app.js
          node --check rev_b/explorer/transforms.js
      - name: Package existing source CAD and viewer
        run: python3 scripts/package_explorer.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site-build
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
